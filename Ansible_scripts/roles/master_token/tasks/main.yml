- name: Retrieve the 'join' command and token
  command: kubeadm token create --print-join-command
  register: join_command_raw

- name: Set the 'join' command for worker nodes
  set_fact:
    join_command: "{{ join_command_raw.stdout_lines[0] }}"

- name: Parse token and discovery-token-ca-cert-hash to join control-plane nodes
  set_fact:
    join_token: "{{ join_command | regex_search('--token\\s+([a-zA-Z0-9\\.-]+)', '\\1') }}"
    join_discovery_hash: "{{ join_command | regex_search('--discovery-token-ca-cert-hash\\s+sha256:([a-zA-Z0-9]+)', '\\1') }}"

- name: Ensure certificate key exists or create a new one
  command: kubeadm init phase upload-certs --upload-certs
  register: cert_key_command

- name: Parse certificate key from output to join control-plane nodes
  set_fact:
    join_cert_key: "{{ cert_key_command.stdout | regex_search('certificate key:\\s+([a-zA-Z0-9\\.-]+)', '\\1') }}"

- name: Check the status of cluster members
  become: yes
  become_user: debian
  shell: kubectl get nodes --no-headers -o custom-columns=:.metadata.name
  register: cluster_nodes

- name: Define the list of cluster members
  set_fact:
    cluster_nodes_list: "{{ cluster_nodes.stdout_lines }}"
